[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rodmena-agentmail"
version = "0.1.0"
description = "Autonomous inter-platform communication for Rodmena coding agents, over the mail API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentmail = "agentmail.cli:main"

[tool.setuptools.packages.find]
include = ["agentmail*"]
